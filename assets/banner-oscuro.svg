<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Fondo oscuro estilizado -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Resplandor decorativo -->
    <radialGradient id="glow" cx="85%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rectangulo de fondo -->
  <rect width="1200" height="300" fill="url(#bgGrad)" rx="12"/>
  <rect width="1200" height="300" fill="url(#glow)" rx="12"/>

  <!-- Borde delgado sutil -->
  <rect x="1" y="1" width="1198" height="298" fill="none" stroke="#30363d" stroke-width="2" rx="11"/>

  <!-- Sigla de fondo / Marca de agua -->
  <text x="1150" y="240" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="140" fill="#21262d" text-anchor="end" opacity="0.5">SIS-INF</text>

  <!-- Contenido Principal -->
  <g transform="translate(80, 0)">
    <!-- Sigla Destacada -->
    <text x="0" y="85" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#58a6ff" letter-spacing="3">SIS-INF</text>

    <!-- Nombre de la Carrera -->
    <text x="0" y="135" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="34" fill="#f0f6fc">Ingeniería de Sistemas e Ingeniería Informática</text>

    <!-- Facultad y Universidad -->
    <text x="0" y="175" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="20" fill="#8b949e">Facultad Nacional de Ingeniería — Universidad Técnica de Oruro</text>

    <!-- Lema / Tagline -->
    <g transform="translate(0, 220)">
      <rect x="0" y="-22" width="410" height="36" fill="#1f6feb" fill-opacity="0.15" rx="6" stroke="#1f6feb" stroke-opacity="0.4" stroke-width="1"/>
      <text x="15" y="2" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="15" fill="#388bfd">Software libre institucional / Open source</text>
    </g>
  </g>
</svg>
