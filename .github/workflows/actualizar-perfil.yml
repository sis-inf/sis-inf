name: Actualizar perfil

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: actualizar-perfil
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Generar secciones del perfil
        run: python scripts/actualizar_perfil.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit y push si cambió el README
        run: |
          if [ -z "$(git status --porcelain -- README.md README.en.md)" ]; then
            echo "Sin cambios en README.md ni README.en.md"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in README.md README.en.md; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git commit -m 'chore: actualizar perfil'
          git push origin HEAD:main
